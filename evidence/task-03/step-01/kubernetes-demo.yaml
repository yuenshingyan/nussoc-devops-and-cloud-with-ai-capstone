apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: finsecure-pay
    environment: demo
  name: finsecure-pay
---
apiVersion: v1
data:
  FINSECURE_MAX_TRANSACTION_AMOUNT: "10000"
  FINSECURE_SUPPORTED_CURRENCIES: SGD,USD,HKD
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: finsecure-pay
  name: finsecure-pay-config-fg4th549cg
  namespace: finsecure-pay
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: finsecure-pay
  name: finsecure-pay
  namespace: finsecure-pay
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: finsecure-pay
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: finsecure-pay
  name: finsecure-pay
  namespace: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: finsecure-pay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finsecure-pay
        app.kubernetes.io/version: 0.2.0
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: finsecure-pay-config-fg4th549cg
        image: docker.io/yuenshingyan/finsecure-pay:0.2.0
        imagePullPolicy: IfNotPresent
        name: api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      nodeSelector:
        kubernetes.io/os: linux
