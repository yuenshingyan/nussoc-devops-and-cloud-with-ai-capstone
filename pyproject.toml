[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "finsecure-pay"
version = "0.1.0"
description = "Transaction-validation API for the FinSecure Pay DevOps capstone"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finsecure_pay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["finsecure_pay"]
branch = true

[tool.coverage.report]
show_missing = true
