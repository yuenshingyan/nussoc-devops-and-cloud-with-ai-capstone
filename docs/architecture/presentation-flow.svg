<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc"><title id="title">FinSecure Pay verified source-to-cloud architecture</title><desc id="desc">GitHub main feeds a source agent and security gates. A separate fixed release worker verifies and publishes the same artifact, then conditionally updates GKE. Locally hosted monitoring observes the cloud API; GKE provides native metrics and logging. AI remains advisory proposal only.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#187d9d"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#173449;font-size:20px}.small{font-size:16px}.title{font-weight:bold;font-size:23px}.box{fill:#edf5fa;stroke:#187d9d;stroke-width:2}.cloud{fill:#e8f5ee;stroke:#258258;stroke-width:2}.warn{fill:#fff3dd;stroke:#b07824;stroke-width:2}.line{stroke:#187d9d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect x="10" y="12" width="1260" height="435" rx="12" fill="#fff" stroke="#c5d3dc"/><text x="640" y="43" text-anchor="middle" class="title">Controller: fixed approved release code · zero executors · serialized releases</text><rect class="box" x="35" y="78" width="165" height="112" rx="9"/><text x="117" y="111" text-anchor="middle" class="title">GitHub main</text><text x="117" y="144" text-anchor="middle" class="small">SCM polling</text><text x="117" y="168" text-anchor="middle" class="small">reviewed source</text><path class="line" d="M200 133 H235"/><rect class="box" x="240" y="78" width="240" height="112" rx="9"/><text x="360" y="108" text-anchor="middle" class="title">Source agent</text><text x="360" y="136" text-anchor="middle" class="small">tests · Bandit · pip-audit</text><text x="360" y="159" text-anchor="middle" class="small">rootless BuildKit · Trivy</text><text x="360" y="181" text-anchor="middle" class="small">no release credentials</text><path class="line" d="M480 133 H515"/><rect class="warn" x="520" y="78" width="245" height="112" rx="9"/><text x="642" y="108" text-anchor="middle" class="title">Release worker</text><text x="642" y="136" text-anchor="middle" class="small">independent archive gates</text><text x="642" y="159" text-anchor="middle" class="small">original-candidate checks</text><text x="642" y="181" text-anchor="middle" class="small">scoped credential bindings</text><path class="line" d="M765 133 H800"/><rect class="box" x="805" y="78" width="180" height="112" rx="9"/><text x="895" y="108" text-anchor="middle" class="title">Docker Hub</text><text x="895" y="139" text-anchor="middle" class="small">exact archive push</text><text x="895" y="163" text-anchor="middle" class="small">digest readback</text><path class="line" d="M985 133 H1020"/><rect class="cloud" x="1025" y="78" width="220" height="112" rx="9"/><text x="1135" y="108" text-anchor="middle" class="title">GKE</text><text x="1135" y="136" text-anchor="middle" class="small">2 nodes · 2 ready Pods</text><text x="1135" y="159" text-anchor="middle" class="small">image-only CAS update</text><text x="1135" y="181" text-anchor="middle" class="small">rollout + HTTP smoke</text><path class="line" d="M1135 192 V230 H895 V267"/><rect class="cloud" x="805" y="272" width="440" height="95" rx="9"/><text x="1025" y="304" text-anchor="middle" class="title">Cloud-native observations</text><text x="1025" y="334" text-anchor="middle">GKE node/Pod metrics · Cloud Logging</text><path class="line" d="M1135 231 H575 V267"/><rect class="box" x="355" y="272" width="410" height="95" rx="9"/><text x="560" y="302" text-anchor="middle" class="title">Existing local monitoring</text><text x="560" y="329" text-anchor="middle" class="small">Prometheus / Grafana → public API sample</text><text x="560" y="352" text-anchor="middle" class="small">Alertmanager → local Mailpit notification</text><rect class="warn" x="35" y="272" width="280" height="95" rx="9" stroke-dasharray="7 5"/><text x="175" y="304" text-anchor="middle" class="title">AI triage proposal</text><text x="175" y="333" text-anchor="middle" class="small">advisory only · not deployed</text><text x="640" y="410" text-anchor="middle" class="small">Synthetic public HTTP only · no host Docker socket on agents · no automatic rollback · no cloud monitoring PVCs</text></svg>
