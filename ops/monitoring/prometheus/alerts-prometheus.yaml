{
  "global": {"scrape_interval": "15s", "scrape_timeout": "5s", "evaluation_interval": "15s"},
  "rule_files": ["/etc/prometheus/alerts.yaml"],
  "alerting": {"alertmanagers": [{"static_configs": [{"targets": ["alertmanager:9093"]}]}]},
  "scrape_configs": [
    {"job_name": "finsecure-pay", "metrics_path": "/metrics", "static_configs": [{"targets": ["application:8000"]}]},
    {"job_name": "prometheus", "static_configs": [{"targets": ["localhost:9090"]}]}
  ]
}
