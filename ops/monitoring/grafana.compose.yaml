{
  "services": {
    "grafana": {
      "image": "grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205",
      "user": "472:472",
      "ports": ["127.0.0.1:3000:3000"],
      "volumes": [
        "./grafana/grafana.ini:/etc/grafana/grafana.ini:ro",
        "./grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/finsecure.yaml:ro",
        "./grafana/provisioning/dashboards/finsecure.yaml:/etc/grafana/provisioning/dashboards/finsecure.yaml:ro",
        "./grafana/dashboards:/etc/grafana/dashboards:ro",
        "grafana-data:/var/lib/grafana",
        "grafana-secrets:/run/secrets:ro"
      ],
      "read_only": true,
      "tmpfs": ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"],
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "cpus": 0.5,
      "mem_limit": "512m",
      "memswap_limit": "512m"
    }
  },
  "volumes": {
    "grafana-data": {},
    "grafana-secrets": {"external": true, "name": "finsecure-monitoring-grafana-secrets"}
  }
}
