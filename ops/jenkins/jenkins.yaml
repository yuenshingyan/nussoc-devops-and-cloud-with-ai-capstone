jenkins:
  systemMessage: "FinSecure Pay — local application CI; no image publishing or cloud deployment configured."
  numExecutors: 0
  scmCheckoutRetryCount: 0
  slaveAgentPort: -1
  # Declare this in the base configuration so removing the overlay resets the flag.
  globalNodeProperties:
    - envVars:
        env:
          - key: FINSECURE_CI_NOTIFICATIONS
            value: "${FINSECURE_CI_NOTIFICATIONS:-false}"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${admin_password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer:
    standard: {}
  nodes:
    - permanent:
        name: finsecure-python
        remoteFS: /home/jenkins/agent
        numExecutors: 1
        labelString: python
        mode: EXCLUSIVE
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              internalDir: remoting
              failIfWorkDirIsMissing: false
unclassified:
  location:
    url: http://127.0.0.1:8080/
