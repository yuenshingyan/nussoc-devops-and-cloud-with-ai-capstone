apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finsecure-deployer
  namespace: finsecure-pay
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [finsecure-pay]
    verbs: [get, patch, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [finsecure-pay]
    verbs: [get]
