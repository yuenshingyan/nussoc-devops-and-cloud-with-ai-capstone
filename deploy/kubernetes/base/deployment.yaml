apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  labels:
    app.kubernetes.io/name: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: finsecure-pay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finsecure-pay
        app.kubernetes.io/version: "0.2.0"
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: api
          # Draft: publish and verify 0.2.0, then pin its digest before cluster deployment.
          # Published 0.1.0 cannot consume the ConfigMap settings below.
          image: docker.io/yuenshingyan/finsecure-pay:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: finsecure-pay-config
