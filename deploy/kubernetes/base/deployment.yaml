apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  labels:
    app.kubernetes.io/name: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: finsecure-pay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finsecure-pay
        app.kubernetes.io/version: "0.2.0"
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: api
          # Published 0.2.0 index: verified Linux ARM64 and AMD64 variants.
          image: docker.io/yuenshingyan/finsecure-pay@sha256:48ee0ef91737fd2ee1d2efea93cf9a94e840eec6908bde6ed3af7afede884e99
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: finsecure-pay-config
